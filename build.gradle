plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = 'EpicVanguard'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Testes automáticos (GameTest do Forge). Ficam fora do jar publicado.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.gametest
                }
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        name = "MinecraftForge"
        url = "https://maven.minecraftforge.net/"
    }
    maven {
        url = "https://maven.blamejared.com"
    }
    // CurseMaven: baixa mods do CurseForge pelo id do projeto e do arquivo (usado para o Epic Fight)
    maven {
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    // Jade (Modrinth Maven) e WTHIT: só a API para compilar os plugins de tooltip (opcionais)
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        url = "https://maven2.bai.lol"
        content { includeGroup "mcp.mobius.waila" }
    }
}

// Epic Fight 20.14.17 (MC 1.20.1, Forge): projeto 405076, arquivo 8049910 no CurseForge.
// Antes o jar ficava versionado em libs/; agora o Gradle baixa sozinho.
def epicFightDep = "curse.maven:epic-fight-mod-405076:8049910"

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Epic Fight é opcional para o mod: compila contra ele e, nas runs de desenvolvimento,
    // carrega junto, a menos que se passe -PnoEpicFight (para testar o mod sem o Epic Fight).
    compileOnly fg.deobf(epicFightDep)
    if (!project.hasProperty('noEpicFight')) {
        runtimeOnly fg.deobf(epicFightDep)
    }

    // Jade / WTHIT: plugins de tooltip opcionais (compat/jade, compat/wthit), só para compilar
    compileOnly fg.deobf("maven.modrinth:jade:11.13.3+forge")
    compileOnly fg.deobf("mcp.mobius.waila:wthit-api:forge-8.21.2")

    // Patchouli: só para testar o livro-guia nas runs de desenvolvimento (o mod não depende dele para compilar)
    // -PnoPatchouli roda sem ele
    if (!project.hasProperty('noPatchouli')) {
        runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:1.20.1-85-FORGE")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "EpicVanguard ${mod_version} [${minecraft_version}].jar"
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}
