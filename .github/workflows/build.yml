# Compila o mod e roda os GameTests a cada push e pull request.
# O jar gerado fica disponível como artefato da execução (aba Actions do GitHub).
name: Build e GameTests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Permissão do gradlew
        run: chmod +x gradlew

      - name: Compilar
        run: ./gradlew build --no-daemon

      - name: GameTests
        run: ./gradlew runGameTestServer --no-daemon

      - name: Guardar o jar
        uses: actions/upload-artifact@v4
        with:
          name: epic-vanguard-jar
          path: build/libs/*.jar
          if-no-files-found: error
